<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="terminalBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Rounded Terminal Window -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#terminalBg)" stroke="#22c55e" stroke-width="2.5" stroke-opacity="0.9"/>
  
  <!-- Traffic Light Dots -->
  <circle cx="14" cy="13" r="2.5" fill="#ef4444" opacity="0.9"/>
  <circle cx="22" cy="13" r="2.5" fill="#eab308" opacity="0.9"/>
  <circle cx="30" cy="13" r="2.5" fill="#22c55e" opacity="0.9"/>
  
  <!-- Terminal Prompt >_ -->
  <g filter="url(#neonGlow)">
    <path d="M 16 30 L 28 39 L 16 48" fill="none" stroke="#22c55e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="33" y1="48" x2="48" y2="48" stroke="#22c55e" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
